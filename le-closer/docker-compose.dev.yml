name: le-closer-dev

services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${LECLOSER_API_PORT:-8003}:8003"
      # Local browser callback for the Google OAuth consent flow.
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      LECLOSER_BACKEND: http://127.0.0.1:8003
      WATCHFILES_FORCE_POLLING: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-client.json
      GOOGLE_TOKEN_FILE: /home/lecloser/.config/lecloser/google_token.json
      GOOGLE_OAUTH_BIND_ADDRESS: 0.0.0.0
      GOOGLE_OAUTH_OPEN_BROWSER: "false"
      LECLOSER_CHROME_PROFILE: /home/lecloser/.config/lecloser/chrome
    volumes:
      - ./backend:/app/backend
      - ./bot:/app/bot
      - ./requirements.txt:/app/requirements.txt:ro
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS in .env to your OAuth client JSON}
        target: /run/secrets/google-client.json
        read_only: true
      - google-state:/home/lecloser/.config/lecloser
    shm_size: 1gb
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${LECLOSER_WEB_PORT:-5173}:5173"
    environment:
      LECLOSER_API_PROXY: http://app:8003
      LECLOSER_POLLING: "true"
    volumes:
      - ./frontend:/app/frontend
      - frontend-deps:/app/frontend/node_modules
    depends_on:
      app:
        condition: service_healthy

volumes:
  google-state:
  frontend-deps:
